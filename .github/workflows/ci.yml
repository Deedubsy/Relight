# Push CI (D-CI): lint, tsc --strict on every package, fixtures, the experiment suite at three seeds, and the
# doc-sync and freshness checks. A red experiment is a red build (constitution rule 3).
name: ci
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # freshness:check needs the history to test source_commit ancestry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated files carry the commit and config hash they were made from (constitution rule 11)
        run: npm run freshness:check
      - name: Experiment suite (E1–E9, three seeds)
        run: npm run experiments
      - name: Docs sync (§7 and §12 tables match packages/sim)
        run: npm run docsync:check
      - name: Scenario B snapshot is reproducible (packages/game/public/snapshots)
        run: npm run snapshot:check
      - name: Calibration (constitution Phase 2 targets C1–C7; reported, not gated)
        run: npm run calibrate -- --out docs/experiments/calibration.json --md docs/experiments/calibration.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiments
          path: |
            docs/EXPERIMENTS.md
            docs/experiments/*.json
            docs/experiments/calibration.md
          retention-days: 30
