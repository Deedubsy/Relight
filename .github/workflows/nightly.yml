# Nightly (D-CI): the seed distribution of the headline numbers at 5 h and the 25 h runs at ten seeds.
# A 5 h run costs ~0.3 s, so 10,000 seeds x 4 policies is ~3.5 h of runner time (~6,000 min/month, past the
# free private-repo budget). The cron runs 1,000 seeds (~20 min); dispatch with seeds=10000 by hand or on the
# self-hosted runner (D-CI) for the full distribution.
# Results are uploaded as an artifact and the summary is committed to docs/experiments/ on main
# (the main ruleset lets the GitHub Actions app bypass the pull-request requirement for this commit).
name: nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Seeds for the 5 h distribution'
        default: '10000'
        required: false
permissions:
  contents: write
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Long suite
        run: npm run nightly -- --seeds-n ${{ github.event.inputs.seeds || '1000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: docs/experiments/nightly*
          retention-days: 90
      - name: Commit summary
        run: |
          git config user.name 'relight-nightly'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/experiments/nightly*
          git diff --cached --quiet && exit 0
          git commit -m "nightly: $(date -u +%F) results"
          git push origin HEAD:main
